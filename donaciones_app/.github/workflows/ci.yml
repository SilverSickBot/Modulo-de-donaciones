name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-coverage:
    name: Pruebas Unitarias y Cobertura (>= 80%)
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pytest-cov

    - name: Ejecutar Pruebas y validar 80% de cobertura
      run: |
        pytest --cov=. --cov-fail-under=80

  deploy-staging:
    name: Despliegue Automático (Entorno de Pruebas)
    needs: test-and-coverage
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Simulación de Despliegue
      run: echo "¡Pruebas exitosas con 80%+ de cobertura! Desplegando..."