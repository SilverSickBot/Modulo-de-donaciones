name: Pipeline CI/CD Donaciones

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. ETAPA: CÓDIGO
  checkout-codigo:
    name: 1. Código
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fuente del repositorio
        uses: actions/checkout@v4

      - name: Validar archivos del repositorio
        run: |
          echo "Verificando estructura del repositorio..."
          ls -la

  # 2. ETAPA: PRUEBAS Y COBERTURA
  pruebas-unitarias:
    name: 2. Pruebas y Cobertura
    needs: checkout-codigo
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f donaciones_app/requirements.txt ]; then pip install -r donaciones_app/requirements.txt; fi
          pip install pytest pytest-cov

      - name: Ejecutar Pruebas
        env:
          PYTHONPATH: donaciones_app
        run: |
          pytest donaciones_app/ --cov=donaciones_app --cov-fail-under=80

  # 3. ETAPA: BUILD
  construccion-build:
    name: 3. Build (Construcción)
    needs: pruebas-unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Descargar fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar compilación
        run: |
          python -m compileall donaciones_app/
          echo "Construcción del proyecto completada con éxito."

  # 4. ETAPA: DESPLIEGUE
  despliegue-staging:
    name: 4. Despliegue
    needs: construccion-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Desplegar en Entorno de Pruebas
        run: |
          echo "Iniciando despliegue automático..."
          echo "Módulo de donaciones desplegado correctamente en el entorno de pruebas."